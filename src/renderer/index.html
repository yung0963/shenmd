<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shenMD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.11.2/dist/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vditor@3.11.2/dist/index.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- 拖放提示 -->
    <div id="drag-overlay" class="drag-overlay">
        <div class="drag-overlay-text">拖放檔案或資料夾至此開啟</div>
    </div>

    <!-- 頂部標題列 -->
    <header id="app-header" class="bg-white border-b border-gray-200 pr-4 pl-2 py-2 flex items-center gap-3 flex-shrink-0 shadow-sm">
        <!-- macOS 視窗控制按鈕預留區 -->
        <div class="w-[70px] flex-shrink-0"></div>
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-[#42b883]" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"/></svg>
            <span class="font-semibold text-gray-800 text-sm">shenMD</span>
        </div>

        <div class="flex items-center gap-1 ml-2">
            <button id="openFolderBtn" class="folder-drawer-btn" title="開啟或收合資料夾">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.75 7.5A1.75 1.75 0 0 1 5.5 5.75h4.125l1.625 1.75H18.5A1.75 1.75 0 0 1 20.25 9.25v1H3.75V7.5Z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.75 10.25h16.5l-1.3 7.1a1.75 1.75 0 0 1-1.72 1.4H6.02a1.75 1.75 0 0 1-1.72-1.42l-.55-7.08Z"/>
                </svg>
            </button>
            <button id="toggleSidebarBtn" class="folder-drawer-btn" title="收合側欄">◂</button>
        </div>

        <!-- 檢視模式 -->
        <div class="flex items-center gap-1 ml-2">
            <button id="viewEdit"    class="view-btn" title="僅編輯">編輯</button>
            <button id="viewSplit"   class="view-btn active" title="分割檢視">分割</button>
            <button id="viewPreview" class="view-btn" title="僅預覽">預覽</button>
            <button id="viewTerminal" class="view-btn" title="Terminal">Terminal</button>
        </div>

        <div class="flex-1"></div>

        <!-- 主題切換 -->
        <div class="relative" id="theme-select-wrap">
            <button id="themeSelectBtn" class="flex items-center gap-1 px-2.5 py-1.5 rounded border border-gray-200 bg-white hover:border-[#42b883] hover:text-[#42b883] text-gray-600 text-xs font-medium transition-colors" title="切換主題">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                <span id="themeLabel">Vue 綠</span>
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="themeDropdown" class="hidden absolute right-0 top-full mt-1.5 bg-white border border-gray-200 rounded-lg shadow-lg py-1.5 z-50 min-w-[140px]">
                <button data-theme="vue" class="theme-opt w-full text-left px-3.5 py-2 text-xs hover:bg-emerald-50 text-gray-700 hover:text-emerald-700 transition-colors flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-[#42b883] border border-gray-200"></span>Vue 綠
                </button>
                <button data-theme="notion" class="theme-opt w-full text-left px-3.5 py-2 text-xs hover:bg-amber-50 text-gray-700 hover:text-amber-700 transition-colors flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-amber-200 border border-gray-200"></span>Notion 風
                </button>
                <button data-theme="github-dark" class="theme-opt w-full text-left px-3.5 py-2 text-xs hover:bg-slate-100 text-gray-700 hover:text-slate-800 transition-colors flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-slate-700 border border-gray-200"></span>GitHub Dark
                </button>
            </div>
        </div>

        <!-- 字型選擇 -->
        <div class="relative" id="font-select-wrap">
            <button id="fontSelectBtn" class="flex items-center gap-1 px-2.5 py-1.5 rounded border border-gray-200 bg-white hover:border-[#42b883] hover:text-[#42b883] text-gray-600 text-xs font-medium transition-colors" title="切換文件字型">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
                <span id="fontLabel">系統預設</span>
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="fontDropdown" class="hidden absolute right-0 top-full mt-1.5 bg-white border border-gray-200 rounded-lg shadow-lg py-1.5 z-50 min-w-[200px] max-h-[420px] overflow-y-auto"></div>
        </div>

        <!-- 字型大小 -->
        <div class="flex items-center gap-1">
            <button id="fontDecBtn" class="w-7 h-7 flex items-center justify-center rounded border border-gray-200 hover:border-[#42b883] hover:text-[#42b883] text-gray-600 font-bold text-xs bg-white transition-colors" title="縮小字型">A-</button>
            <span id="fontSizeLabel" class="text-xs text-gray-500 w-10 text-center">15px</span>
            <button id="fontIncBtn" class="w-7 h-7 flex items-center justify-center rounded border border-gray-200 hover:border-[#42b883] hover:text-[#42b883] text-gray-600 font-bold text-xs bg-white transition-colors" title="放大字型">A+</button>
        </div>

        <div id="csvEncodingWrap" class="hidden items-center gap-2 text-xs text-gray-600">
            <span>CSV 編碼</span>
            <select id="csvEncodingSelect" class="border border-gray-300 rounded px-2 py-1 bg-white text-xs outline-none focus:border-[#42b883]">
                <option value="auto">自動</option>
                <option value="big5">Big5</option>
                <option value="utf-8">UTF-8</option>
                <option value="utf-16le">UTF-16 LE</option>
                <option value="utf-16be">UTF-16 BE</option>
                <option value="gb18030">GB18030</option>
            </select>
        </div>

        <!-- 儲存按鈕 -->
        <button id="saveBtn" disabled class="flex items-center gap-1.5 text-gray-400 border border-gray-300 bg-gray-50 cursor-not-allowed rounded px-3 py-1.5 text-xs font-medium transition-colors" title="儲存檔案 (Ctrl+S)">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
            儲存
        </button>

        <!-- Word 匯出 -->
        <button id="exportWordBtn" class="bg-blue-600 hover:bg-blue-700 transition-colors text-white px-4 py-1.5 rounded-md shadow-sm font-medium text-sm flex items-center gap-2" title="匯出 Word (.docx)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            匯出 Word
        </button>

        <button id="exportExcelBtn" class="hidden bg-emerald-600 hover:bg-emerald-700 transition-colors text-white px-4 py-1.5 rounded-md shadow-sm font-medium text-sm flex items-center gap-2" title="將 CSV 匯出為 Excel (.xlsx)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            CSV 轉 Excel
        </button>

        <!-- PDF 匯出 -->
        <button id="openPdfPanelBtn" class="bg-[#42b883] hover:bg-[#33a06f] transition-colors text-white px-4 py-1.5 rounded-md shadow-sm font-medium text-sm flex items-center gap-2" title="PDF 匯出設定">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            匯出 PDF
        </button>
    </header>

    <div id="tabbar" class="border-b border-gray-200 bg-white flex items-center gap-1 px-3 py-1.5 overflow-x-auto flex-shrink-0 shadow-sm">
        <div id="tabs-list" class="flex items-center gap-1 min-w-0 flex-1"></div>
        <button id="newTabBtn" class="tab-add-btn" title="新增分頁">+</button>
    </div>

    <!-- 主內容區 -->
    <main class="flex flex-1 overflow-hidden">

        <aside id="sidebar" class="sidebar-panel">
            <div class="sidebar-compact-header">
                <div class="sidebar-compact-copy">
                    <span class="sidebar-kicker">Workspace</span>
                    <span id="sidebarFolderName" class="sidebar-compact-name">未開啟資料夾</span>
                </div>
                <span id="sidebarFolderPath" class="sidebar-compact-path">使用上方資料夾按鈕開啟</span>
            </div>

            <section class="sidebar-section" data-section="recent-files">
                <button class="sidebar-section-toggle" data-section-toggle="recent-files" title="切換 Recent Files">
                    <span class="sidebar-section-title">Recent Files</span>
                    <span class="sidebar-section-chevron">▾</span>
                </button>
                <div id="recentFilesList" class="sidebar-list sidebar-scroll-panel"></div>
            </section>

            <section class="sidebar-section" data-section="recent-folders">
                <button class="sidebar-section-toggle" data-section-toggle="recent-folders" title="切換 Recent Folders">
                    <span class="sidebar-section-title sidebar-section-title-with-icon">
                        <span class="folder-spark-icon" aria-hidden="true">
                            <span class="folder-spark-body"></span>
                            <span class="folder-spark-tab"></span>
                            <span class="folder-spark-star">✦</span>
                        </span>
                        Recent Folders
                    </span>
                    <span class="sidebar-section-chevron">▾</span>
                </button>
                <div id="recentFoldersList" class="sidebar-list sidebar-scroll-panel"></div>
            </section>

            <section class="sidebar-section" data-section="git-panel">
                <button class="sidebar-section-toggle" data-section-toggle="git-panel" title="切換 Git">
                    <span class="sidebar-section-title">Git</span>
                    <span class="sidebar-section-chevron">▾</span>
                </button>
                <div id="gitPanel" class="sidebar-list"></div>
            </section>

            <section class="sidebar-section sidebar-tree-section" data-section="folder-tree">
                <button class="sidebar-section-toggle" data-section-toggle="folder-tree" title="切換 Folder Tree">
                    <span class="sidebar-section-title">Folder Tree</span>
                    <span class="sidebar-section-chevron">▾</span>
                </button>
                <div id="folderTree" class="folder-tree sidebar-scroll-panel"></div>
            </section>
        </aside>

        <!-- 編輯器面板 -->
        <div id="editor-panel" class="flex flex-col overflow-hidden" style="width:50%">
            <!-- Markdown 工具列 -->
            <div id="md-toolbar">
                <button class="tb-btn" data-action="bold" title="插入粗體 (Ctrl+B)"><b>B</b></button>
                <button class="tb-btn" data-action="italic" title="插入斜體 (Ctrl+I)"><i>I</i></button>
                <button class="tb-btn" data-action="strike" title="插入刪除線" style="text-decoration:line-through">S</button>
                <div class="tb-sep"></div>
                <button class="tb-btn" data-action="ul" title="插入無序清單">•</button>
                <button class="tb-btn" data-action="ol" title="插入有序清單">1.</button>
                <button class="tb-btn" data-action="quote" title="插入引用">"</button>
                <div class="tb-sep"></div>
                <button class="tb-btn" data-action="link" title="插入連結 (Ctrl+K)">🔗</button>
                <button class="tb-btn" data-action="image" title="插入圖片">🖼</button>
                <div class="tb-sep"></div>
                <button class="tb-btn" data-action="inlinecode" title="插入行內程式碼">`c`</button>
                <button class="tb-btn" data-action="codeblock" title="插入程式碼區塊" style="font-size:0.65rem">```</button>
                <div class="tb-sep"></div>
                <button class="tb-btn" data-action="table" title="插入表格" style="font-size:0.7rem">表</button>
                <button class="tb-btn" data-action="hr" title="插入水平線">—</button>
            </div>
            <!-- 搜尋與取代面板 -->
            <div id="search-panel" class="hidden border-b border-gray-200 bg-gray-50 px-3 py-2 flex-col gap-2 flex-shrink-0 text-xs text-gray-600 transition-all">
                <!-- 搜尋行 -->
                <div class="flex items-center gap-2">
                    <button id="search-toggle-replace" class="w-6 h-6 flex items-center justify-center rounded hover:bg-gray-200 transition-colors" title="切換取代面板">
                        <svg class="w-3.5 h-3.5 transform transition-transform" id="search-replace-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                    <!-- 搜尋輸入框 -->
                    <div class="flex-1 flex items-center border border-gray-300 rounded bg-white px-2 py-1" id="search-input-wrap">
                        <input type="text" id="search-input" class="flex-1 outline-none bg-transparent" placeholder="搜尋 (Cmd+F)">
                        <div class="flex items-center gap-1 ml-1.5 border-l border-gray-200 pl-1.5 flex-shrink-0">
                            <button id="search-case-sensitive" class="w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:bg-gray-100 font-bold" title="區分大小寫 (Aa)">Aa</button>
                            <button id="search-whole-word" class="w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:bg-gray-100 font-bold font-mono text-[10px]" title="全字匹配 (ab 不匹配 abc)">ab</button>
                            <button id="search-regex" class="w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:bg-gray-100 font-bold font-mono text-[10px]" title="使用正規表示式 (.*)">.*</button>
                        </div>
                    </div>
                    <!-- 搜尋導覽 -->
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <span id="search-results-count" class="text-gray-400 font-medium px-1 select-none min-w-[32px] text-center">0/0</span>
                        <button id="search-prev" class="w-6 h-6 flex items-center justify-center rounded hover:bg-gray-200" title="上一個 (Shift+Enter)">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                            </svg>
                        </button>
                        <button id="search-next" class="w-6 h-6 flex items-center justify-center rounded hover:bg-gray-200" title="下一個 (Enter)">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        <button id="search-close" class="w-6 h-6 flex items-center justify-center rounded hover:bg-gray-200" title="關閉 (Esc)">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- 取代行 -->
                <div id="replace-row" class="hidden items-center gap-2 pl-8">
                    <div class="flex-1 flex items-center border border-gray-300 rounded bg-white px-2 py-1" id="replace-input-wrap">
                        <input type="text" id="replace-input" class="flex-1 outline-none bg-transparent" placeholder="取代為">
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <button id="replace-btn" class="px-2.5 py-1 border border-gray-300 rounded bg-white hover:border-[#42b883] hover:text-[#42b883] transition-colors font-medium" title="取代">取代</button>
                        <button id="replace-all-btn" class="px-2.5 py-1 border border-gray-300 rounded bg-white hover:border-[#42b883] hover:text-[#42b883] transition-colors font-medium" title="全部取代">全部取代</button>
                    </div>
                </div>
            </div>
            <!-- 編輯器標題列 -->
            <div class="flex items-center justify-between px-3 py-1 bg-gray-50 border-b border-gray-200 flex-shrink-0">
                <span id="editorModeLabel" class="text-xs font-medium text-gray-400">Markdown</span>
                <span id="edit-stats" class="text-xs text-gray-400"></span>
            </div>
            <div class="editor-wrap">
                <div id="line-numbers" class="line-numbers" aria-hidden="true"></div>
                <div class="highlight-layer" aria-hidden="true"><div class="highlight-content"></div></div>
                <textarea id="editor" placeholder="在此輸入 Markdown..." spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
                <div id="readonlyOverlay" class="readonly-overlay hidden">
                    <div class="readonly-overlay-card">
                        <span class="readonly-chip">PDF</span>
                        <h3>唯讀檢視</h3>
                        <p>PDF 會直接在右側預覽，不進入文字編輯流程。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 拖曳分隔線 -->
        <div id="resize-handle" title="拖曳調整寬度"></div>

        <!-- 預覽面板 -->
        <div id="preview-panel" class="flex flex-col overflow-hidden border-l border-gray-200" style="width:50%">
            <div class="flex items-center justify-between px-3 py-1 bg-gray-50 border-b border-gray-200 flex-shrink-0">
                <span id="previewModeLabel" class="text-xs font-medium text-gray-400">預覽</span>
            </div>
            <div id="preview-wrapper" class="flex-1 overflow-y-auto">
                <div id="preview-content" class="vue-markdown max-w-none p-6"></div>
                <div id="vditor-host" class="hidden"></div>
            </div>
        </div>

        <div id="terminal-width-handle" class="terminal-width-handle" title="拖曳調整 Terminal 寬度"></div>

        <section id="terminal-drawer" class="terminal-drawer">
            <div id="terminal-header" class="terminal-header">
                <div class="terminal-header-left">
                    <div class="terminal-title-group">
                        <span class="terminal-title">Terminal</span>
                        <span id="terminalStatusText" class="terminal-meta">未啟動</span>
                        <span id="terminalCwdText" class="terminal-meta terminal-path">-</span>
                    </div>
                </div>
                <div class="terminal-header-actions">
                    <button id="terminalFocusBtn" class="terminal-chip-btn" title="聚焦 Terminal (Cmd+Shift+C)">Focus</button>
                    <button id="terminalRestartBtn" class="terminal-chip-btn" title="重啟 Terminal">Restart</button>
                    <button id="terminalClearBtn" class="terminal-chip-btn" title="清空輸出">Clear</button>
                    <button id="terminalCloseBtn" class="terminal-chip-btn" title="關閉 Terminal">Close</button>
                </div>
            </div>
            <div class="terminal-toolbar">
                <button id="terminalCdBtn" class="terminal-action-btn">cd 到目前資料夾</button>
                <button id="terminalInsertFileBtn" class="terminal-action-btn">貼上目前檔案路徑</button>
                <button id="terminalInsertDirBtn" class="terminal-action-btn">貼上目前資料夾路徑</button>
                <button id="terminalCodexBtn" class="terminal-action-btn">插入 codex &lt;file&gt;</button>
                <button id="terminalPiBtn" class="terminal-action-btn">插入 pi agent &lt;file&gt;</button>
            </div>
            <div id="terminalMount" class="terminal-mount"></div>
            <div id="terminalErrorBanner" class="terminal-error hidden"></div>
        </section>
    </main>

    <!-- 狀態列 -->
    <div id="statusbar">
        <span id="status">就緒</span>
        <div class="stat-sep"></div>
        <span id="stat-words">0 字</span>
        <span id="stat-lines">1 行</span>
        <span id="stat-chars">0 字元</span>
        <div class="stat-sep"></div>
        <span id="stat-file" class="italic text-gray-400">未開啟檔案</span>
    </div>

    <!-- PDF 設定面板 -->
    <div id="gitFloatingOverlay" class="git-floating-overlay hidden">
        <section id="gitFloatingPanel" class="git-floating-panel" role="dialog" aria-modal="true" aria-labelledby="gitFloatingTitle">
            <div class="git-floating-header">
                <div>
                    <h2 id="gitFloatingTitle">Git</h2>
                    <p id="gitFloatingSubtitle"></p>
                </div>
                <button id="gitFloatingCloseBtn" class="git-floating-close" title="關閉">×</button>
            </div>
            <div id="gitFloatingBody" class="git-floating-body"></div>
        </section>
    </div>

    <div id="pdf-panel" aria-hidden="true">
        <div id="pdf-overlay"></div>
        <div id="pdf-dialog" role="dialog" aria-modal="true" aria-labelledby="pdf-dialog-title">
            <div class="flex items-center justify-between">
                <h2 id="pdf-dialog-title" class="text-base font-semibold text-gray-800">PDF 匯出設定</h2>
                <button id="closePdfPanel" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="pdf-field">
                <label>檔案名稱</label>
                <input type="text" id="pdf-filename" placeholder="Document" value="Document">
            </div>

            <div class="pdf-field">
                <label>方向</label>
                <div class="pdf-radio-group">
                    <label><input type="radio" name="pdf-orient" value="portrait" checked><span>縱向</span></label>
                    <label><input type="radio" name="pdf-orient" value="landscape"><span>橫向</span></label>
                </div>
            </div>

            <div class="pdf-field">
                <label>邊距 (mm)</label>
                <div class="pdf-radio-group">
                    <label><input type="radio" name="pdf-margin" value="8"><span>窄 (8)</span></label>
                    <label><input type="radio" name="pdf-margin" value="15" checked><span>標準 (15)</span></label>
                    <label><input type="radio" name="pdf-margin" value="25"><span>寬 (25)</span></label>
                </div>
            </div>

            <div class="pdf-field">
                <label>紙張大小</label>
                <div class="pdf-radio-group">
                    <label><input type="radio" name="pdf-size" value="a4" checked><span>A4</span></label>
                    <label><input type="radio" name="pdf-size" value="letter"><span>Letter</span></label>
                    <label><input type="radio" name="pdf-size" value="a3"><span>A3</span></label>
                </div>
            </div>

            <button id="exportPdfBtn" class="mt-2 w-full flex items-center justify-center gap-2 bg-[#42b883] hover:bg-[#33a06f] text-white font-semibold py-2.5 rounded-lg transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                匯出 PDF
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
